<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>CyberGear social cover source</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #17191f; color: #f4f3f7; font-family: 'DM Sans', sans-serif; }
    .cover { position: relative; width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(ellipse at 88% 43%, #292b36 0, #17191f 59%); }
    .brand { position: absolute; left: 54px; top: 44px; display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -1.7px; }
    .brand svg { width: 25px; height: 29px; fill: #a970ff; }
    .edition { position: absolute; right: 54px; top: 56px; color: #b7b7c3; font-size: 13px; letter-spacing: 2.2px; text-transform: uppercase; }
    .copy { position: absolute; left: 54px; top: 169px; z-index: 2; }
    .eyebrow { margin: 0 0 24px; color: #b786ff; font-size: 16px; font-weight: 500; }
    h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 79px; font-weight: 500; line-height: 1.02; letter-spacing: -5.4px; }
    h1 span { display: block; }
    .subtitle { margin: 25px 0 0; color: #b8b9c3; font-size: 17px; line-height: 1.6; }
    .watermark { position: absolute; left: 663px; top: 153px; color: #ffffff05; font-family: 'Space Grotesk', sans-serif; font-size: 170px; line-height: 1; font-weight: 700; letter-spacing: -12px; }
    .scene { position: absolute; left: 507px; top: 107px; width: 728px; height: 461px; }
    .scene canvas { display: block; width: 100%; height: 100%; }
    .footer { position: absolute; inset: auto 54px 40px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #ffffff20; padding-top: 25px; }
    .categories { display: flex; gap: 29px; color: #c6c6ce; font-size: 15px; }
    .signature { display: flex; align-items: center; gap: 18px; font-size: 16px; font-weight: 500; }
    .arrow { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #7938ff; }
    .arrow svg { width: 19px; height: 19px; fill: none; stroke: white; stroke-width: 1.6; }
  </style>
</head>
<body>
  <main class="cover">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>CyberGear</div>
    <span class="edition">Performance Studio</span>
    <div class="copy">
      <p class="eyebrow">A better feel. A better game.</p>
      <h1><span>Make every</span><span>move count</span></h1>
      <p class="subtitle">The gear you reach for.<br />The difference you feel.</p>
    </div>
    <span class="watermark" aria-hidden="true">60HE</span>
    <div class="scene" role="img" aria-label="Angled black keyboard with violet switches and a bright yellow strap"></div>
    <div class="footer">
      <div class="categories"><span>Keyboards</span><span>Mice</span><span>Audio</span></div>
      <div class="signature">Your desk. Your rules.<span class="arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14" /></svg></span></div>
    </div>
  </main>
  <script type="module">
    import { createHeroScene } from '../js/modules/product-scenes.js';
    createHeroScene(document.querySelector('.scene'), 'kb-wooting-60he');
  </script>
</body>
</html>
